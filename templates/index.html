<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تجهيز صور الـ ID</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header>
    <h1>📷 تجهيز صور الـ ID</h1>
    <p class="subtitle">ارفع صور وجوه شخصية وحوّلها لصور ID احترافية بخلفية بيضاء</p>
  </header>

  <main>
    <!-- ── Settings panel ─────────────────────────────────────── -->
    <section class="settings card">
      <h2>⚙️ إعدادات الإخراج</h2>

      <div class="settings-grid">
        <!-- Size presets -->
        <div class="field">
          <label for="preset">مقاس الصورة</label>
          <select id="preset">
            <option value="413x531">3.5 × 4.5 سم (باسبور – 300 DPI)</option>
            <option value="600x600">2 × 2 إنش (أمريكي – 300 DPI)</option>
            <option value="354x472">3 × 4 سم (300 DPI)</option>
            <option value="custom">مخصّص …</option>
          </select>
        </div>

        <!-- Custom size (hidden by default) -->
        <div class="field custom-size" id="custom-size-fields" hidden>
          <label>العرض (px)</label>
          <input type="number" id="custom-width" min="32" max="4000" value="413" />
          <label>الارتفاع (px)</label>
          <input type="number" id="custom-height" min="32" max="4000" value="531" />
        </div>

        <!-- Output format -->
        <div class="field">
          <label for="output-format">صيغة الملف</label>
          <select id="output-format">
            <option value="JPEG">JPEG</option>
            <option value="PNG">PNG</option>
          </select>
        </div>
      </div>
    </section>

    <!-- ── Upload area ────────────────────────────────────────── -->
    <section class="upload-area card" id="drop-zone">
      <input type="file" id="file-input" accept="image/*" multiple hidden />
      <div class="drop-hint" id="drop-hint">
        <span class="icon">📂</span>
        <p>اسحب الصور هنا أو <button class="link-btn" id="browse-btn">اختر ملفات</button></p>
        <p class="small-text">يُقبل: JPG، PNG، WebP، BMP – حتى 16 MB إجمالاً</p>
      </div>
    </section>

    <!-- ── Action bar ─────────────────────────────────────────── -->
    <div class="action-bar" id="action-bar" hidden>
      <button class="btn btn-primary" id="process-btn">🚀 معالجة الصور</button>
      <button class="btn btn-secondary" id="clear-btn">🗑️ مسح الكل</button>
      <button class="btn btn-success" id="download-btn" hidden>
        ⬇️ تحميل ZIP
      </button>
    </div>

    <!-- ── Progress bar ───────────────────────────────────────── -->
    <div id="progress-wrap" hidden>
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <p id="progress-label">جاري المعالجة…</p>
    </div>

    <!-- ── Image grid ─────────────────────────────────────────── -->
    <section class="gallery" id="gallery"></section>
  </main>

  <footer>
    <p>مدعوم بـ MediaPipe · Flask · OpenCV</p>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
